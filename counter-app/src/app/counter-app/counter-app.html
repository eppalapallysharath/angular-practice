<div class="main-counter-div">
  <div>
    <h3>Counter App</h3>
  </div>
  <div>
    <p class="counter">Count {{ count }}</p>
  </div>
  <div style="text-align: center;">
    <button class="btn btn-orange" (click)="increment()">Increment</button>
    <button class="btn btn-green" (click)="decrement()">Decrement</button>
    <button class="btn btn-red" (click)="reset()">Rest count</button>
  </div>
</div>
